<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FJW. — Section B</title>
    <style>
        :root {
            --navy: #14253d;
            --blue: #294f74;
            --page: #f3f5fa;
            --text: #202a39;
            --muted: #7d8799;
            --line: #d8ebf0;
            --white: #fff;
            --radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--page); color: var(--text); padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { background: linear-gradient(135deg, var(--navy), var(--blue)); color: var(--white); padding: 30px; border-radius: var(--radius); margin-bottom: 20px; }
        header h1 { font-size: 1.8rem; margin-bottom: 8px; }
        header p { color: var(--line); font-size: 0.95rem; }
        
        .card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
        .card h3 { margin-bottom: 15px; color: var(--navy); font-size: 1.2rem; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: var(--muted); }
        .form-control { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.95rem; }
        
        .btn { background: var(--blue); color: var(--white); border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: var(--navy); }
        .btn-danger { background: #d9534f; }
        
        .admin-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--white); padding: 15px 20px; border-radius: var(--radius); border: 1px solid var(--line); }
        
        .item-list { display: grid; gap: 12px; }
        .item-card { background: var(--page); padding: 15px; border-radius: 10px; border: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
        .item-info h4 { color: var(--navy); margin-bottom: 4px; }
        .item-info p { font-size: 0.9rem; color: var(--muted); }
        .item-info img { max-width: 100px; max-height: 100px; border-radius: 6px; margin-top: 8px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>One class. One shared space.</h1>
        <p>Assignments, presentations, resources and class updates, organized together.</p>
        <div style="margin-top: 10px; font-size: 0.8rem; background: rgba(255,255,255,0.2); display: inline-block; padding: 4px 10px; border-radius: 20px;">SECTION B - ACADEMIC HUB</div>
    </header>

    <!-- Admin Login Bar -->
    <div class="admin-bar">
        <span id="admin-status">وضع الزائر (للعرض فقط)</span>
        <button class="btn" id="admin-toggle-btn" onclick="toggleAdmin()">تسجيل مشرف</button>
    </div>

    <!-- Upload Section (Visible to Admin Only) -->
    <div class="card" id="upload-section" style="display: none;">
        <h3>إضافة واجب أو ملف جديد</h3>
        <div class="form-group">
            <label>عنوان الواجب / الملف</label>
            <input type="text" id="item-title" class="form-control" placeholder="مثال: واجب المادة البرمجية الأسبوع الأول">
        </div>
        <div class="form-group">
            <label>الوصف أو التفاصيل</label>
            <textarea id="item-desc" class="form-control" rows="3" placeholder="اكتب التفاصيل هنا..."></textarea>
        </div>
        <div class="form-group">
            <label>اختر صورة أو ملف (اختياري)</label>
            <input type="file" id="item-file" class="form-control" accept="image/*,.pdf,.doc,.docx">
        </div>
        <button class="btn" onclick="addNewItem()">نشر المحتوى</button>
    </div>

    <!-- Display Section -->
    <div class="card">
        <h3>الواجبات والنشاطات الأخيرة</h3>
        <div id="items-container" class="item-list">
            <p style="color: var(--muted); text-align: center; padding: 20px;">لا توجد واجبات مضافة حتى الآن.</p>
        </div>
    </div>
</div>

<script>
    let isAdmin = localStorage.getItem('isAdmin') === 'true';
    updateAdminUI();
    loadItems();

    function toggleAdmin() {
        if (!isAdmin) {
            let pass = prompt("أدخل كلمة المرور الخاصة بالمشرف:");
            if (pass === "admin123") {
                isAdmin = true;
                localStorage.setItem('isAdmin', 'true');
                alert("تم تسجيل الدخول كمشرف بنجاح!");
            } else {
                alert("كلمة المرور غير صحيحة!");
                return;
            }
        } else {
            isAdmin = false;
            localStorage.setItem('isAdmin', 'false');
            alert("تم تسجيل الخروج من وضع المشرف.");
        }
        updateAdminUI();
    }

    function updateAdminUI() {
        const statusEl = document.getElementById('admin-status');
        const btnEl = document.getElementById('admin-toggle-btn');
        const uploadEl = document.getElementById('upload-section');

        if (isAdmin) {
            statusEl.textContent = "أنت مسجل حالياً كـ [مشرف]";
            btnEl.textContent = "تسجيل خروج";
            uploadEl.style.display = "block";
        } else {
            statusEl.textContent = "وضع الزائر (للعرض فقط)";
            btnEl.textContent = "تسجيل مشرف";
            uploadEl.style.display = "none";
        }
        loadItems();
    }

    function addNewItem() {
        const title = document.getElementById('item-title').value.trim();
        const desc = document.getElementById('item-desc').value.trim();
        const fileInput = document.getElementById('item-file');

        if (!title) {
            alert("الرجاء إدخال عنوان للمحتوى على الأقل.");
            return;
        }

        let newItem = {
            id: Date.now(),
            title: title,
            desc: desc,
            fileData: null,
            fileName: null
        };

        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function (e) {
                newItem.fileData = e.target.result;
                newItem.fileName = fileInput.files[0].name;
                saveAndRender(newItem);
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            saveAndRender(newItem);
        }
    }

    function saveAndRender(item) {
        let items = JSON.parse(localStorage.getItem('fjw_items') || '[]');
        items.unshift(item);
        localStorage.setItem('fjw_items', JSON.stringify(items));
        
        document.getElementById('item-title').value = '';
        document.getElementById('item-desc').value = '';
        document.getElementById('item-file').value = '';
        
        loadItems();
    }

    function loadItems() {
        const container = document.getElementById('items-container');
        let items = JSON.parse(localStorage.getItem('fjw_items') || '[]');

        if (items.length === 0) {
            container.innerHTML = `<p style="color: var(--muted); text-align: center; padding: 20px;">لا توجد واجبات مضافة حتى الآن.</p>`;
            return;
        }

        container.innerHTML = '';
        items.forEach(item => {
            let fileElement = '';
            if (item.fileData) {
                if (item.fileData.startsWith('data:image/')) {
                    fileElement = `<img src="${item.fileData}" alt="Uploaded image">`;
                } else {
                    fileElement = `<p style="margin-top: 5px;"><a href="${item.fileData}" download="${item.fileName}" target="_blank">📥 تحميل الملف: ${item.fileName}</a></p>`;
                }
            }

            let deleteBtn = isAdmin ? `<button class="btn btn-danger" onclick="deleteItem(${item.id})" style="padding: 5px 10px; font-size: 0.8rem;">حذف</button>` : '';

            const div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `
                <div class="item-info">
                    <h4>${escapeHtml(item.title)}</h4>
                    <p>${escapeHtml(item.desc || '')}</p>
                    ${fileElement}
                </div>
                ${deleteBtn}
            `;
            container.appendChild(div);
        });
    }

    function deleteItem(id) {
        if (!confirm("هل أنت متأكد من حذف هذا العنصر؟")) return;
        let items = JSON.parse(localStorage.getItem('fjw_items') || '[]');
        items = items.filter(item => item.id !== id);
        localStorage.setItem('fjw_items', JSON.stringify(items));
        loadItems();
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
</html>
